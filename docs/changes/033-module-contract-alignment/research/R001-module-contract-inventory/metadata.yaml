title: "业务模块统一契约清单与现状缺口"
question: "现有业务模块（Todo/Auth/Ops/Migration）应遵循的统一模块契约是什么？各模块当前的 binding / 接入现状是否完整实现，缺失或仍采用旧方式的有哪些？"
