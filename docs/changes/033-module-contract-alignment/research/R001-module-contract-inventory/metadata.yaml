summary: "统一契约应包含：HTTP binding（模块顶层 handler/ + binding/http 契约/装箱 + contract-gen 注册）、config binding、cli binding、migration binding、i18n binding（业务模块自有语言资源 + binding）、middleware（横切）。现状：Todo 是最完整参考（已按 030/031 分层，i18n 仅消费）；Ops 的 management HTTP 仍是 binding/http 内手写 http.Handler + 自建 ServeMux，未走代码优先契约且不参与 contract-gen（但它是独立 management 监听，非公开 API）；Auth 只有 middleware+adapter，无自有 HTTP 契约；Migration 只有 cli+config；i18n 目前仅 Todo 消费，无业务模块自有的 i18n binding。"
