schema_version: 1
id: R002
title: "typed code-first 生成路径与工具可行性"
question: "如果要让模块以 Go 代码声明自己的 HTTP 契约，再由代码生成 openapi.yaml，现有依赖与在树工具能否支撑；与 024 已评估过的 Huma/ogen 路径相比，项目自有 typed 声明 + 生成器是否可行？"
research_type: current-project
topics: ["typed code-first", "OpenAPI generation", "JSON Schema", "module-owned contract", "generator", "invopop/jsonschema", "kin-openapi"]
keywords: ["contract declaration", "openapi.yaml generation", "json schema from Go struct", "ReflectFromType", "openapi3.T", "go:generate", "oasdiff"]
languages: ["Go"]
frameworks: ["kin-openapi v0.142.0", "invopop/jsonschema v0.14.0"]
technologies: ["OpenAPI 3.0.3", "JSON Schema", "yaml.v3"]
applicable_scenarios: ["030 生成器设计", "模块自有契约声明", "契约文件由代码生成", "第三方工具封装"]
non_applicable_scenarios: ["运行期加载远端 spec", "动态插件路由", "客户端 SDK 生成", "多服务拆分"]
status: active
summary: "本地模块缓存已确认 invopop/jsonschema v0.14.0 提供 Reflect/ReflectFromType 与 jsonschema 标签体系，可从 Go struct 生成 JSON Schema；kin-openapi v0.142.0 可程序化构建 openapi3.T 并序列化 YAML；两者均已在依赖树/module cache 中且为稳定版本。因此“项目自有 typed 声明 -> 生成 openapi.yaml”技术上可行，且不需要新增第三方生成框架；与 024 已拒绝的 Huma/ogen 相比，本方案保持模块只依赖项目自有类型，第三方只存在于生成器与 transport 内部。"
