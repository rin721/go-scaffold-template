id: R001
title: "当前 HTTP 契约方向与模块耦合复核"
question: "当前 HTTP 契约由谁管理、朝哪个方向生成，模块对契约的依赖边界在哪里，第三方库暴露到什么程度，以及既有决策是否锁死了该方向？"
research_type: current-project
topics: ["HTTP contract authority", "spec-first", "module ownership", "third-party boundary", "OpenAPI", "oapi-codegen"]
keywords: ["api/openapi.yaml", "oapi-codegen", "StrictServerInterface", "HandlerWithOptions", "openapi-inventory", "nethttp-middleware", "kin-openapi", "GetSwagger", "ADR-003"]
languages: ["Go"]
frameworks: ["Chi", "oapi-codegen v2.8.0"]
technologies: ["OpenAPI 3.0.3", "kin-openapi v0.142.0", "nethttp-middleware v1.2.0"]
applicable_scenarios: ["030 设计计划", "契约方向反转", "模块自有契约声明", "第三方封装边界"]
non_applicable_scenarios: ["改变公开 HTTP 行为", "拆分独立服务", "动态路由注册", "新增真实业务用例"]
status: active
summary: "当前是 spec-first 单轨：api/openapi.yaml 是唯一 authority，oapi-codegen 从它生成 DTO 与 strict Chi route binding，openapi-inventory 从它生成 operation inventory；模块 HTTP binding 依赖生成包 internal/transport/http/api，composition 以完整 StrictServerInterface 静态聚合收口；transport 直接使用 chi/kin-openapi/nethttp-middleware。ADR-003（024）已把 spec-first OpenAPI 3.0.3 固定为已实施决策，本任务要求反转为 typed code-first 模块自有契约，必须明确取代该决策的权限来源。"
