schema_version: 1
id: R002
title: "调度引擎与 Redis 协调主源评估"
question: "cron/fixedDelay 应复用哪个成熟 Go 调度引擎，Redis 分布式执行权可以承诺什么，哪些上游能力不能直接当作本项目保证？"
research_type: external-primary-sources
topics: ["gocron", "cron", "fixedDelay", "distributed-lock", "redis", "lease"]
keywords: ["WithIntervalFromCompletion", "CronJob", "Locker", "SET NX PX", "token", "renew", "fencing"]
applicable_scenarios: ["Go 进程内定时触发", "Redis 可续租执行权", "多实例任务领导权", "有界关闭"]
non_applicable_scenarios: ["多 Redis Redlock 部署", "共识系统 leader election", "业务副作用 exactly-once", "外部 SaaS scheduler"]
status: active
summary: "gocron/v2 可作为被封装的触发引擎；其 Locker 不同步多实例运行时间，不能独自满足严格周期唯一性。Redis lease 必须使用 token、原子续期/释放和失权取消，并明确 fencing/时钟/故障域限制。"
