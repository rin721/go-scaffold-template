summary: "Logger、强制 baseline 和配置化 replacement 已实现；当前开发默认 level=info 会过滤 debug，生产调用点只有一个真实 Debug 且没有 Warn，启动链只记录少数成功里程碑，开发文档也未规定必须记录哪些事件。应保留现有封装，改为 development=debug、production=info，补齐阶段化低敏事件与唯一错误记录边界，并建立权威开发规范和回归门禁。"
