summary: "既有规则已经要求模块拥有专属 Adapter/binding，当前 Auth、Ops 与 Migration 基本符合；Todo 手写 HTTP Adapter 位于顶层 transport、applicationRouter 直接构造 Todo Handler、cmd/app 直接导入 Ops Model，且现有 package graph 未阻止这些外溢。025 应保留全局 OpenAPI 与纯生成协议代码，迁回所有手写 Todo HTTP 语义，以窄端口连接 Auth，并补可执行边界门禁；不存在真实职责的空层不得补建。"
