schema_version: 1
id: R002
title: "消息可靠性与 Provider 主源比较"
question: "RabbitMQ、NATS JetStream、Kafka 与 Watermill 的确认、重投递、死信、恢复和事务语义中，哪些可进入公共契约，首个 Provider 应如何选择？"
research_type: external-primary-source
topics: ["RabbitMQ", "NATS JetStream", "Kafka", "Watermill", "ack", "redelivery", "dead-letter"]
keywords: ["publisher confirms", "manual ack", "delayed retry", "basic.reject", "basic.nack", "DLX", "delivery limit", "offset commit", "DoubleAck", "Router"]
applicable_scenarios: ["消息 Provider 选型", "at-least-once 消费", "Broker 原生可靠性", "多 Provider 扩展"]
non_applicable_scenarios: ["业务消息 Schema", "部署容量规划", "跨 Broker 原子双写", "外部存储 exactly-once"]
status: active
summary: "RabbitMQ 4.3 的 confirms、manual ack、quorum delayed retry、delivery-limit 与 DLX 最适合首个 Provider；业务重试用 counted reject，基础设施延后用 non-counting nack，Kafka/NATS 差异留在后续 Provider。"
