title: "业务模块装配流程与职责审计"
question: "业务模块完成后，接入是否只需在 internal/composition 一处装配/依赖注入即可完成？是否存在为接入某模块而必须跨层修改多个位置、反向依赖或职责越界的情况？"
research_type: current-project
topics: ["module wiring", "composition", "reverse dependency", "layering", "assembly purity", "generic-first"]
