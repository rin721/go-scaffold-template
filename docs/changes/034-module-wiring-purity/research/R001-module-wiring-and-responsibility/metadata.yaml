status: active
summary: "现状：接入一个 HTTP 业务模块需要跨多个 composition 文件手改（http_api.go 的 Todo 专属 contractDispatcher、service.go 的 operationPolicies 硬编码 todohttp.ModuleContract、ops.go import todohttp.ModuleContract 推导 observability ops、todo.go CLI executor、generation.go 装配），并在 composition 之外修改 contract-gen 的 registeredModules()。其中 service.go/ops.go 直接依赖 Todo 契约包支撑了合成逻辑，属于契约知识多点扩散与跨模块反向读取的迹象。需要判断哪些是合理装配职责、哪些偏离了“仅 composition 一处装配”的单一职责。"
