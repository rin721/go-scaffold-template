schema_version: 1
id: R005
title: "当前资源终结、重试与强制关闭语义"
question: "当前进程实际拥有和对外提供的每种资源在构造失败、drain、Close 错误、重试、force、超时和释放验证方面分别具有什么语义，统一策略与组件重写应如何划界？"
research_type: current-project-and-external-primary
topics: ["resource finalization", "close retry", "force close", "graceful drain", "partial construction", "release verification"]
keywords: ["database/sql", "go-redis", "zap", "fsnotify", "net/http", "S3", "cleanup debt", "finalizer policy"]
languages: ["Go"]
frameworks: ["net/http", "GORM", "go-redis", "zap", "fsnotify", "AWS SDK for Go v2"]
technologies: ["Kernel Lease", "Supervisor Participant", "database/sql DB", "redis Client", "logger sinks", "HTTP Server"]
applicable_scenarios: ["FOUNDATION-LIFECYCLE-001", "资源 Adapter 设计", "终止与重载故障验收", "运行中清理运维入口"]
non_applicable_scenarios: ["假定所有 io.Closer 都可重试", "从独立 CLI 进程直接关闭服务进程内资源", "把 force close 作为统一默认", "声明计划已经实现"]
status: active
summary: "统一层应治理 admission、drain、owner/generation、attempt 和终态；默认 Close 是一次 terminal attempt 而非自动 retry。只有 Adapter 明确证明可重试或安全 force 时才能重写策略。当前数据库、Redis、logger、fsnotify 均不能靠重复 Close 完成失败重试，HTTP 才有显式但有损的 graceful-to-force 路径；实际 StorageManager 当前没有需关闭的底层句柄。"
