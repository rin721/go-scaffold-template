schema_version: 1
id: R003
title: "成熟 Go 项目的装配、运行与清理实践对照"
question: "成熟 Go 项目如何处理显式装配、长期任务、ready、原子配置切换、优雅终止和失败清理，这些实践是否支持当前架构的保留或重构？"
research_type: external-primary
topics: ["Go runtime lifecycle", "graceful shutdown", "dependency injection", "atomic reload", "health", "failure observation"]
keywords: ["net/http Shutdown", "Fx Lifecycle", "controller-runtime Manager", "dskit services", "Caddy reload", "Wire"]
languages: ["Go"]
frameworks: ["net/http", "Fx", "controller-runtime", "dskit", "Caddy", "Wire"]
technologies: ["context", "lifecycle hooks", "runnable", "health checks", "immutable config generation"]
applicable_scenarios: ["022 架构取舍", "生命周期失败语义", "业务扩展契约边界"]
non_applicable_scenarios: ["直接复制外部框架 API", "证明当前实现已满足外部语义", "替项目选择部署平台"]
status: active
summary: "主流项目在框架形态上不同，但共同要求 owner 可识别、运行态可观察、停止有界且终态真实；Caddy 的不可变代际支持当前 reload 方向，Fx/Wire 不足以替代项目特有事务，controller-runtime 与 dskit 则说明 Runner、ready、health 和 terminal state 必须显式。"
