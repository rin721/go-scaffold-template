summary: "模块私有 JWT Adapter 没有泄漏 jwx 类型，符合业务模块内封装方向；Ops 的 exported 装配协议却暴露具体 Prometheus/OTel Adapter 与 trace.Tracer，且进程级 Observability 被误放在应用模块技术目录。应保留业务专属 Adapter 的模块内归属，同时把非业务 Observability 建成项目自有 Capability 并经 Kernel App 底层装配，所有边界禁止第三方类型泄漏。"
