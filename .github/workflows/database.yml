name: Database

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  sqlite:
    name: SQLite and package boundaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Test
        run: go test ./...
      - name: Race test
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Verify module files
        run: go mod tidy -diff
      - name: Verify CGO-free build
        env:
          CGO_ENABLED: "0"
        run: go build ./...

  postgres:
    name: PostgreSQL contract
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: scaffold_test
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d scaffold_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Run PostgreSQL repository contract
        env:
          TEST_DATABASE_POSTGRES_DSN: postgres://postgres:postgres@127.0.0.1:5432/scaffold_test?sslmode=disable
        run: go test ./pkg/database -run TestConfiguredServerDrivers/postgres -count=1

  mysql:
    name: MySQL contract
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: scaffold_test
          MYSQL_ROOT_PASSWORD: mysql
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pmysql"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Run MySQL repository contract
        env:
          TEST_DATABASE_MYSQL_DSN: root:mysql@tcp(127.0.0.1:3306)/scaffold_test?parseTime=true
        run: go test ./pkg/database -run TestConfiguredServerDrivers/mysql -count=1
