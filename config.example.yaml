# go-scaffold-template 全量配置示例。
#
# 使用方式：
#   Copy-Item config.example.yaml config.yaml
#   go run ./cmd/app
#
# 环境变量使用 APP_ 前缀，并以双下划线分隔嵌套字段。
# 例如 APP_DATABASE__DRIVER、APP_DATABASE__DSN、APP_LOGGER__LEVEL。

logger:
  # 运行环境：development（开发）或 production（生产）。
  environment: development
  # environment: production

  # 最低日志级别：debug、info、warn 或 error。
  level: info
  # level: debug
  # level: warn
  # level: error

  # encoding 默认由 environment 推导：development 使用 console，production 使用 json。
  # 只有需要覆盖环境默认值时才取消注释并保留一个选项。
  # encoding: console
  # encoding: json

  # 普通日志输出目标；可使用 stdout 或文件路径。
  outputPaths:
    - stdout
    # - ./logs/app.log

  # Logger 内部错误输出目标；可使用 stderr 或文件路径。
  errorOutputPaths:
    - stderr
    # - ./logs/app-error.log

  # addCaller 默认由 environment 推导，当前 development 和 production 均为 true。
  # addCaller: true
  # addCaller: false

  # addStacktrace 默认由 environment 推导：development 为 false，production 为 true。
  # addStacktrace: false
  # addStacktrace: true

database:
  # GORM 由 internal/kernel/app/database 在代码中明确选择；配置不切换底层实现。
  # Driver 选择数据库协议：sqlite、postgres 或 mysql。
  driver: sqlite
  # driver: postgres
  # driver: mysql

  # SQLite 默认路径可直接用于本地启动；目录和文件权限、foreign keys、busy timeout 与 WAL 由包内治理。
  dsn: .data/app.db

  # PostgreSQL/MySQL 的 DSN 不应写入配置文件，改用环境变量，例如：
  # PostgreSQL:
  #   $env:APP_DATABASE__DSN = 'postgres://<user>:<password>@localhost:5432/<database>?sslmode=disable'
  # MySQL:
  #   $env:APP_DATABASE__DSN = '<user>:<password>@tcp(localhost:3306)/<database>?parseTime=true'

  pool:
    # 最大打开连接数；0 使用 database 包默认值，负数非法。
    maxOpenConns: 25
    # 最大空闲连接数；0 使用 database 包默认值，负数非法。
    maxIdleConns: 5
    # 单连接最大生命周期；0 使用 database 包默认值，负数非法。
    connMaxLifetime: 30m0s
    # 空闲连接最大保留时间；0 使用 database 包默认值，负数非法。
    connMaxIdleTime: 5m0s

  # 构造和就绪检查的超时时间；0 使用 database 包默认值，负数非法。
  pingTimeout: 5s

cache:
  # 默认显式禁用，因此本地启动不依赖 Redis。启用后只允许 redis。
  # Cache 后端配置变化需要重启，避免既有 typed Client 的 L1 状态跨后端迁移。
  driver: disabled
  # driver: redis

  redis:
    address: 127.0.0.1:6379
    username: ""
    # 密码不要写入配置文件，使用 APP_CACHE__REDIS__PASSWORD。
    password: ""
    database: 0
    dialTimeout: 5s
    readTimeout: 3s
    writeTimeout: 3s
    # 0 使用 go-redis 默认连接池计算；负数非法。
    poolSize: 0
    minIdleConns: 0
    tagPrefix: "cache:tag:"
    pingTimeout: 5s

i18n:
  defaultLanguage: zh-CN
  # 资源路径相对进程工作目录，支持 JSON、YAML 和 YML。
  messageFiles: []
  # messageFiles:
  #   - locales/messages.zh-CN.yaml
  #   - locales/messages.en.json
  # 缺失翻译策略：error 或 use-id。
  missingBehavior: error
  # missingBehavior: use-id

storage:
  # 默认使用受控本地目录；也可选择 disabled、s3、minio、local+s3 或 local+minio。
  driver: local
  local:
    basePath: .data/storage
    publicUrl: ""

  s3:
    # provider 可选 s3 或 r2。
    provider: s3
    endpoint: ""
    region: us-east-1
    bucket: ""
    # 凭据不要写入配置文件，使用 APP_STORAGE__S3__ACCESSKEYID 和
    # APP_STORAGE__S3__SECRETACCESSKEY。
    accessKeyId: ""
    secretAccessKey: ""
    usePathStyle: false
    publicBaseUrl: ""

  minio:
    provider: minio
    endpoint: ""
    region: us-east-1
    bucket: ""
    # 使用 APP_STORAGE__MINIO__ACCESSKEYID 和 APP_STORAGE__MINIO__SECRETACCESSKEY。
    accessKeyId: ""
    secretAccessKey: ""
    usePathStyle: true
    publicBaseUrl: ""

todo:
  # 标题按 Unicode 字符数校验，不能只包含空白。
  titleMaxRunes: 120
  # list 未显式指定 limit 时使用的数量。
  defaultListLimit: 20
  # list 单次查询允许的最大数量。
  maxListLimit: 100

http:
  # HTTP listener 在进程 ready 前同步绑定；端口占用会使启动失败。
  addr: :8080
  readHeaderTimeout: 5s
  readTimeout: 15s
  writeTimeout: 30s
  idleTimeout: 1m0s
  maxHeaderBytes: 1048576
  # 单个业务请求的 application deadline，不替代 socket timeout。
  requestTimeout: 10s
  maxRequestBodyBytes: 1048576
  # 单进程并发上限；超出返回 503 和受控 Retry-After。
  maxInFlight: 128
  # 默认不信任 X-Forwarded-For；只有直连 peer 命中 CIDR 时才采用转发地址。
  trustedProxyCIDRs: []
  rateLimit:
    requestsPerSecond: 100
    burst: 200
  cors:
    # 空列表拒绝跨域；同源和非浏览器请求不需要加入。
    allowedOrigins: []
    allowedMethods: [GET, POST, PATCH, OPTIONS]
    allowedHeaders: [Authorization, Content-Type, X-Request-ID]
